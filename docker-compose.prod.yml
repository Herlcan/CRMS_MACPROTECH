services:
  app:
    build: .
    image: macprotech-app:${APP_IMAGE_TAG:-prod}
    container_name: macprotech-app
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HTTP_PORT:-8080}:80"
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: "${DB_NAME:?Set DB_NAME in .env}"
      DB_USER: "${DB_USER:?Set DB_USER in .env}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      MACPROTECH_APP_KEY: "${MACPROTECH_APP_KEY:?Set MACPROTECH_APP_KEY in .env}"
      MACPROTECH_IDLE_TIMEOUT_SECONDS: "${MACPROTECH_IDLE_TIMEOUT_SECONDS:-1800}"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
    volumes:
      - uploads_data:/var/www/html/src/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: macprotech-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}"
      MARIADB_DATABASE: "${DB_NAME:?Set DB_NAME in .env}"
      MARIADB_USER: "${DB_USER:?Set DB_USER in .env}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    volumes:
      - db_data:/var/lib/mysql
      - ./crms_macprotech.sql:/docker-entrypoint-initdb.d/01-crms_macprotech.sql:ro
      - ./database/security_integrity_migration.sql:/docker-entrypoint-initdb.d/02-security_integrity_migration.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    profiles:
      - tools
    image: phpmyadmin:5
    container_name: macprotech-phpmyadmin
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads_data:
